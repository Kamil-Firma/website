			var months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
			function reload_list(){
				var picker = document.getElementById('picker');
				var toadd = "";
				for(i=0; i<basegame.length; i++){
					var me = basegame[i];
					var myunix = new Date(me[3]);
					var mydate = myunix.getDate().toString() + " " + months[myunix.getMonth()] + " " + myunix.getFullYear().toString();
					var mytime = myunix.getHours().toString() + ":" + myunix.getMinutes().toString();
					var is_beta = me[1];
					
					if( is_beta==0 ){
						toadd += "<div class='version'>";
					}else{
						toadd += "<div class='version beta'>";
					}
					toadd += "<span class='date'>" + mydate + " <span class='time'>(" + mytime + ")</span></span>";
					toadd += "<span class='vernum'>" + "v. " + me[0] + "</span>";
					
					toadd += "<span class='versionbutton'>";
					toadd += "<a href='" + get_link(i) + "'>";
					toadd += "LINK";
					toadd += "</a>";
					toadd += "</span>";
					
					toadd += "</div>";
					toadd += "<br>";
				}
				picker.innerHTML = toadd;
			}
			reload_list();
			
			function get_link(linkId){
				// template = https://gamejolt.com/get/build?game=X&build=Y
				var gameId = games[basegame[linkId][1]];
				var buildId = basegame[linkId][2];
				return "https://gamejolt.com/get/build?game=" + gameId + "&build=" + buildId;
